# cangjie3_fuzzy: adjacent-key typo tolerance (pc 寬範圍 keyboard), generated by package_fuzzy.py from cangjie3_fluency.
# Two streams: the exact translator is unchanged and always first; the fuzzy translator offers candidates reachable by ONE
# adjacent-key substitution in a spelling of 2 to 5 letters, listed after the exact ones.
# Rime schema
# encoding: utf-8
#
# 倉頡三代 整句輸入 (MS 新倉頡 / Windows XP 新倉頡 style sentence auto-correction)
# Same engine behaviour as cangjie5_fluency (v1); only the code table differs.
# The table cangjie3.base.dict.yaml is generated at install time from PIME mscj3.cin
# (tools/cin2rime.py or install.ps1 -Cangjie3) and is NOT part of this repository.
#
# Ideas taken from eight04's `quick5_fluency` (rime/rime-quick issue #2):
#   fluency_editor, no abc_segmentor, recognizer `abc` pattern,
#   single-letter codes forced to end with a space, space handled by punctuator.
# Differences: full Cangjie 3 codes only (no 速成 derive), standalone file
# (no __include of quick5.schema.yaml).

schema:
  schema_id: cangjie3_fuzzy
  name: 倉頡三代整句（鄰鍵容錯，pc 寬範圍 鍵盤）
  version: "0.1"
  author:
    - 朱邦復先生 (倉頡)
    - 佛振 (rime-cangjie / rime-quick)
    - eight04 (quick5_fluency prototype)
  description: |
    全碼倉頡三代（微軟新倉頡相容），詞句連打（整句輸入），語言模型：八股文 (librime-octagram)
    3rd generation Cangjie; table from PIME mscj3.cin, downloaded at install time
  dependencies:
    - luna_quanpin
    - cangjie3_fuzzy_prism

switches:
  - name: ascii_mode
    reset: 0
    states: [ 中文, 西文 ]
    abbrev: [ 中, Ａ ]
  - name: full_shape
    states: [ 半角, 全角 ]
  - name: simplification
    states: [ 漢字, 汉字 ]
  - name: ascii_punct
    states: [ 。，, ．， ]

engine:
  processors:
    - ascii_composer
    - recognizer
    - key_binder
    - speller
    - punctuator
    - selector
    - navigator
    - fluency_editor
  segmentors:
    - ascii_segmentor
    - matcher
    # abc_segmentor intentionally NOT used: the recognizer pattern `abc`
    # below tags the whole preedit as one segment so it can be re-segmented
    # as a sentence.
    - punct_segmentor
    - fallback_segmentor
  translators:
    - punct_translator
    - script_translator
    - script_translator@fuzzy
    - reverse_lookup_translator
  filters:
    - simplifier
    - uniquifier

speller:
  alphabet: zyxwvutsrqponmlkjihgfedcba
  delimiter: " ;'"
  algebra:
    # A single-letter code must be followed by a space (otherwise "a" is
    # ambiguous with the first letter of every longer code).
    - 'xform/^(\w)$/$1 /'

translator:
  dictionary: cangjie3_fluency
  prism: cangjie3_fluency
  initial_quality: 100
  # same values as grammar.yaml:/hant, repeated here so the model is still
  # used if grammar.yaml is missing (the `grammar:/hant?` patch below is
  # optional and silently skipped when the file is absent)
  contextual_suggestions: true
  max_homophones: 7
  max_homographs: 7
  preedit_format:
    - "xlit|abcdefghijklmnopqrstuvwxyz;'|日月金木水火土竹戈十大中一弓人心手口尸廿山女田難卜符··|"
  comment_format:
    - "xlit|abcdefghijklmnopqrstuvwxyz~|日月金木水火土竹戈十大中一弓人心手口尸廿山女田難卜符～|"
  disable_user_dict_for_patterns:
    - "^z.*$"
    - "^yyy.*$"

fuzzy:
  dictionary: cangjie3_fluency
  prism: cangjie3_fuzzy_prism
  initial_quality: -100
  # same values as grammar.yaml:/hant, repeated here so the model is still
  # used if grammar.yaml is missing (the `grammar:/hant?` patch below is
  # optional and silently skipped when the file is absent)
  contextual_suggestions: true
  max_homophones: 7
  max_homographs: 7
  preedit_format:
    - "xlit|abcdefghijklmnopqrstuvwxyz;'|日月金木水火土竹戈十大中一弓人心手口尸廿山女田難卜符··|"
  comment_format:
    - "xlit|abcdefghijklmnopqrstuvwxyz~|日月金木水火土竹戈十大中一弓人心手口尸廿山女田難卜符～|"
  disable_user_dict_for_patterns:
    - "^z.*$"
    - "^yyy.*$"

reverse_lookup:
  dictionary: luna_pinyin
  prism: luna_quanpin
  prefix: "`"
  suffix: "'"
  tips: 〔拼音〕
  preedit_format:
    - xform/([nl])v/$1ü/
    - xform/([nl])ue/$1üe/
    - xform/([jqxy])v/$1u/
  comment_format:
    - "xlit|abcdefghijklmnopqrstuvwxyz|日月金木水火土竹戈十大中一弓人心手口尸廿山女田難卜符|"

grammar:
  # needs librime-octagram + zh-hant-t-essay-bgw.gram in the user/shared dir
  language: zh-hant-t-essay-bgw

simplifier:
  tips: all

punctuator:
  # Treat space as a symbol: it commits the preedit, then types a space.
  use_space: true
  import_preset: default
  half_shape:
    ' ': { commit: ' ' }

key_binder:
  # Like default.yaml's key_binder but WITHOUT paging_with_comma_period and
  # paging_with_minus_equal: with them "." "-" "=" page the candidate menu
  # instead of typing 。 - = in the middle of a sentence. Page_Up/Page_Down
  # and the arrow keys still page.
  bindings:
    __patch:
      - key_bindings:/emacs_editing
      - key_bindings:/numbered_mode_switch

recognizer:
  import_preset: default
  patterns:
    reverse_lookup: "`[a-z]*'?$"
    # letters, optionally separated by single spaces, optional trailing space
    abc: "^[a-z]+( [a-z]+)* ?$"

ascii_composer:
  good_old_caps_lock: true
  switch_key:
    Shift_L: commit_text
    Shift_R: commit_code
    Control_L: noop
    Control_R: noop
    Caps_Lock: noop
    Eisu_toggle: clear

__patch:
  # language model (librime-octagram + zh-hant-t-essay-bgw.gram)
  - grammar:/hant?
  # user overrides: cangjie3_fluency.custom.yaml
  - cangjie3_fluency.custom:/patch?
