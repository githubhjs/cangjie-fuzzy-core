translator:
  dictionary: cangjie5_fluency
  prism: cangjie5_fuzzy_prism
  # same values as grammar.yaml:/hant, repeated here so the model is still
  # used if grammar.yaml is missing (the `grammar:/hant?` patch below is
  # optional and silently skipped when the file is absent)
  contextual_suggestions: true
  max_homophones: 7
  max_homographs: 7
  preedit_format:
    - "xlit|abcdefghijklmnopqrstuvwxyz;'|日月金木水火土竹戈十大中一弓人心手口尸廿山女田難卜符··|"
  comment_format:
    - "xlit|abcdefghijklmnopqrstuvwxyz~|日月金木水火土竹戈十大中一弓人心手口尸廿山女田難卜符～|"
  disable_user_dict_for_patterns:
    - "^z.*$"
    - "^yyy.*$"

reverse_lookup:
  dictionary: luna_pinyin
  prism: luna_quanpin
  prefix: "`"
  suffix: "'"
  tips: 〔拼音〕
  preedit_format:
    - xform/([nl])v/$1ü/
    - xform/([nl])ue/$1üe/
    - xform/([jqxy])v/$1u/
  comment_format:
    - "xlit|abcdefghijklmnopqrstuvwxyz|日月金木水火土竹戈十大中一弓人心手口尸廿山女田難卜符|"

grammar:
  # needs librime-octagram + zh-hant-t-essay-bgw.gram in the user/shared dir
  language: zh-hant-t-essay-bgw

simplifier:
  tips: all

punctuator:
  # Treat space as a symbol: it commits the preedit, then types a space.
  use_space: true
  import_preset: default
  half_shape:
    ' ': { commit: ' ' }

key_binder:
  # Like default.yaml's key_binder but WITHOUT paging_with_comma_period and
  # paging_with_minus_equal: with them "." "-" "=" page the candidate menu
  # instead of typing 。 - = in the middle of a sentence. Page_Up/Page_Down
  # and the arrow keys still page.
  bindings:
    __patch:
      - key_bindings:/emacs_editing
      - key_bindings:/numbered_mode_switch

recognizer:
  import_preset: default
  patterns:
    reverse_lookup: "`[a-z]*'?$"
    # letters, optionally separated by single spaces, optional trailing space
    abc: "^[a-z]+( [a-z]+)* ?$"

ascii_composer:
  good_old_caps_lock: true
  switch_key:
    Shift_L: commit_text
    Shift_R: commit_code
    Control_L: noop
    Control_R: noop
    Caps_Lock: noop
    Eisu_toggle: clear

__patch:
  # language model (librime-octagram + zh-hant-t-essay-bgw.gram)
  - grammar:/hant?
  # user overrides: cangjie5_fluency.custom.yaml
  - cangjie5_fluency.custom:/patch?
