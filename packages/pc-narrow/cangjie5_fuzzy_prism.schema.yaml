# Rime schema
# encoding: utf-8
#
# 倉頡五代 整句輸入 (MS 新倉頡 style sentence auto-correction)
#
# Ideas taken from eight04's `quick5_fluency` (rime/rime-quick issue #2):
#   fluency_editor, no abc_segmentor, recognizer `abc` pattern,
#   single-letter codes forced to end with a space, space handled by punctuator.
# Differences: full Cangjie 5 codes only (no 速成 derive), standalone file
# (no __include of quick5.schema.yaml).

schema:
  schema_id: cangjie5_fuzzy_prism
  name: 倉頡五代容錯（內部：容錯索引，請勿選用）
  version: "0.1"
  author:
    - 朱邦復先生 (倉頡)
    - 佛振 (rime-cangjie / rime-quick)
    - eight04 (quick5_fluency prototype)
  description: |
    全碼倉頡五代，詞句連打（整句輸入），語言模型：八股文 (librime-octagram)
    碼表源自倉頡之友發佈的《五倉世紀版》
  dependencies:
    - luna_quanpin

switches:
  - name: ascii_mode
    reset: 0
    states: [ 中文, 西文 ]
    abbrev: [ 中, Ａ ]
  - name: full_shape
    states: [ 半角, 全角 ]
  - name: simplification
    states: [ 漢字, 汉字 ]
  - name: ascii_punct
    states: [ 。，, ．， ]

engine:
  processors:
    - ascii_composer
    - recognizer
    - key_binder
    - speller
    - punctuator
    - selector
    - navigator
    - fluency_editor
  segmentors:
    - ascii_segmentor
    - matcher
    # abc_segmentor intentionally NOT used: the recognizer pattern `abc`
    # below tags the whole preedit as one segment so it can be re-segmented
    # as a sentence.
    - punct_segmentor
    - fallback_segmentor
  translators:
    - punct_translator
    - script_translator
    - reverse_lookup_translator
  filters:
    - simplifier
    - uniquifier

speller:
  alphabet: zyxwvutsrqponmlkjihgfedcba
  delimiter: " ;'"
  algebra:
    # A single-letter code must be followed by a space (otherwise "a" is
    # ambiguous with the first letter of every longer code).
    - 'fuzz/^([a-z]{0})[s]([a-z]{1,})$/${1}A${2}/'
    - 'fuzz/^([a-z]{0})[nv]([a-z]{1,})$/${1}B${2}/'
    - 'fuzz/^([a-z]{0})[vx]([a-z]{1,})$/${1}C${2}/'
    - 'fuzz/^([a-z]{0})[fs]([a-z]{1,})$/${1}D${2}/'
    - 'fuzz/^([a-z]{0})[rw]([a-z]{1,})$/${1}E${2}/'
    - 'fuzz/^([a-z]{0})[dg]([a-z]{1,})$/${1}F${2}/'
    - 'fuzz/^([a-z]{0})[fh]([a-z]{1,})$/${1}G${2}/'
    - 'fuzz/^([a-z]{0})[gj]([a-z]{1,})$/${1}H${2}/'
    - 'fuzz/^([a-z]{0})[ou]([a-z]{1,})$/${1}I${2}/'
    - 'fuzz/^([a-z]{0})[hk]([a-z]{1,})$/${1}J${2}/'
    - 'fuzz/^([a-z]{0})[jl]([a-z]{1,})$/${1}K${2}/'
    - 'fuzz/^([a-z]{0})[k]([a-z]{1,})$/${1}L${2}/'
    - 'fuzz/^([a-z]{0})[n]([a-z]{1,})$/${1}M${2}/'
    - 'fuzz/^([a-z]{0})[bm]([a-z]{1,})$/${1}N${2}/'
